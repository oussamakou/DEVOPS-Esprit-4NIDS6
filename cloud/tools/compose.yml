name: student-tools
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Generate a private .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sonar -d sonar']
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 1g
    restart: unless-stopped
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Generate a private .env}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    # Bootstrap only via owner SSH tunnel. Enable public HTTPS after changing admin credentials.
    ports: ['127.0.0.1:9000:9000']
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  nexus:
    image: sonatype/nexus3:3.97.1
    environment:
      NEXUS_SECRETS_KEY_FILE: /run/secrets/nexus-secrets.json
    volumes:
      - nexus_data:/nexus-data
      - ./nexus-secrets.json:/run/secrets/nexus-secrets.json:ro
    ports: ['127.0.0.1:8081:8081']
    mem_limit: 4g
    restart: unless-stopped
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    ports: ['443:443', '8443:8443']
    environment:
      SONAR_DOMAIN: ${SONAR_DOMAIN:-sonar.invalid}
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:-nexus.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    restart: unless-stopped
volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  nexus_data:
  caddy_data:
  caddy_config:
