apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: student
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: student
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: mysql
        image: mysql:8.4
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: '1', memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: studentdb
        - name: MYSQL_USER
          value: student
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        volumeMounts:
          - name: data
            mountPath: /var/lib/mysql
        startupProbe:
          exec:
            command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -ustudent studentdb -e "SELECT 1"']
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -ustudent studentdb -e "SELECT 1"']
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 3306}
          periodSeconds: 20
        ports:
        - containerPort: 3306
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: student
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
