apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: student
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: acr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: student-app
        image: IMAGE_PLACEHOLDER
        ports:
        - name: http
          containerPort: 8089
        - name: management
          containerPort: 9090
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        startupProbe:
          httpGet: {path: /actuator/health/liveness, port: management}
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: management}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: management}
          periodSeconds: 15
        env:
        - name: DB_URL
          value: jdbc:mysql://mysql:3306/studentdb
        - name: DB_USERNAME
          value: student
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: student
spec:
  type: NodePort
  selector:
    app: student-app
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30089
