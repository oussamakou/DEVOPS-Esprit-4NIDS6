apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-mysql
  namespace: student
spec:
  podSelector:
    matchLabels: {app: mysql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: student-app}
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-ingress
  namespace: student
spec:
  podSelector:
    matchLabels: {app: student-app}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8089
    - from:
        - podSelector:
            matchLabels: {app: prometheus}
      ports:
        - protocol: TCP
          port: 9090
