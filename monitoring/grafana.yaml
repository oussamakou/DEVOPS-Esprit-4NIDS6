apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: student
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: student
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports: [{containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: admin-password}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: dashboard-provider.yaml}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: config
          configMap: {name: grafana-provisioning}
        - name: dashboard
          configMap: {name: student-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: student
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
