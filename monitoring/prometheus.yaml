apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: student
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: student-api
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [student-metrics:9090]
    rule_files: [/etc/prometheus/alerts.yml]
  alerts.yml: |
    groups:
      - name: student-api
        rules:
          - alert: StudentApiDown
            expr: up{job="student-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Student API metrics unavailable for two minutes
---
apiVersion: v1
kind: Service
metadata:
  name: student-metrics
  namespace: student
spec:
  selector: {app: student-app}
  ports: [{name: metrics, port: 9090, targetPort: management}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h, --storage.tsdb.retention.size=256MB]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: student
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
