spring.application.name=student-management
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/studentdb}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Server configuration :
server.port=8089
server.servlet.context-path=/student

# Management uses a separate internal port; the public Service excludes it.
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=student-management
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
