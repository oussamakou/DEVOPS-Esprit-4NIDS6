name: Acceptance - Nmap Azure network policy
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: acceptance-nmap-azure
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    name: Nmap acceptance - deployed Azure VMs
    if: github.ref == 'refs/heads/master'
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.COMPOSE_VM_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Nmap from the Ubuntu package repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: External TCP exposure scan (owned public IPs only)
        id: public
        continue-on-error: true
        run: python scripts/nmap-acceptance.py scan --view public --output .tools/reports/acceptance/public
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        id: azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Private and localhost scans through the Azure control plane
        if: ${{ !cancelled() && steps.azure.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/azure-nmap-acceptance.py --output .tools/reports/acceptance/private
      - name: Blocking acceptance policy and standalone HTML report
        if: ${{ !cancelled() }}
        run: python scripts/nmap-acceptance.py combine --reports .tools/reports/acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nmap-acceptance-original-reports
          path: .tools/reports/acceptance/
          retention-days: 30
      - name: Include Nmap in the shared DevSecOps report format
        if: ${{ !cancelled() }}
        env:
          SECURITY_REPORT_ARTIFACT: devsecops-security-reports-acceptance
        run: python scripts/render-security-reports.py .tools/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: devsecops-security-reports-acceptance
          path: .tools/reports/
          retention-days: 30
