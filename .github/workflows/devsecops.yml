name: Commit security and Azure k3s

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Disable build caches for a controlled timing comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security before Maven
    uses: ./.github/workflows/prebuild-security.yml

  build:
    needs: security
    name: 1 - Maven build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: inputs.cold_cache != true
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Maven compile, test and JaCoCo coverage
        run: python3 scripts/capture-check.py maven .tools/reports/build -- bash ./mvnw -B -ntp verify
      - name: Keep the Surefire and JaCoCo reports
        if: always()
        run: |
          mkdir -p .tools/reports/build
          cp -r target/surefire-reports .tools/reports/build/ || echo "No Surefire reports were produced"
          cp -r target/site/jacoco .tools/reports/build/ || echo "No JaCoCo report was produced"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-build
          path: .tools/reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-jar
          path: target/student-management-0.0.1-SNAPSHOT.jar
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          retention-days: 14

  docker:
    name: 4 - Docker build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-jar
          path: target
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ci
          platforms: linux/amd64
          tags: student-management:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ inputs.cold_cache == true }}
          pull: true
      - run: sha256sum /tmp/image.tar > /tmp/image.tar.sha256
      - name: Test the built image and manifests on ephemeral k3s
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/install-tools.py k3d
          docker load --input /tmp/image.tar
          python3 scripts/stage-facts.py .tools/reports/image docker-build \
            image="student-management:$COMMIT_SHA" \
            image_id="$(docker image inspect --format '{{.Id}}' "student-management:$COMMIT_SHA")" \
            size_bytes="$(docker image inspect --format '{{.Size}}' "student-management:$COMMIT_SHA")" \
            tar_sha256="$(cut -d' ' -f1 /tmp/image.tar.sha256)"
          python3 scripts/capture-check.py k3s-smoke .tools/reports/image -- bash scripts/smoke-k3s.sh "student-management:$COMMIT_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-image-build
          path: .tools/reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-image
          path: |
            /tmp/image.tar
            /tmp/image.tar.sha256
          retention-days: 3

  trivy:
    name: 5 - Trivy HIGH/CRITICAL gate
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-image
          path: /tmp
      - run: python3 scripts/install-tools.py trivy
      - run: |
          cd /tmp
          sha256sum -c image.tar.sha256
          cd "$GITHUB_WORKSPACE"
          python3 scripts/capture-check.py trivy-image .tools/reports/image -- .tools/trivy image --input /tmp/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output .tools/reports/image/trivy-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-image-scan
          path: .tools/reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vulnerability-report
          path: .tools/reports/image/trivy-image.json
          retention-days: 14

  reports:
    name: DevSecOps security reports - every stage of this push
    needs: [security, build, docker, trivy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect pre-commit and commit evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: professor-security-reports
          path: .tools/reports
      - name: Collect build and image evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage-*
          merge-multiple: true
          path: .tools/reports
      - name: Generate the combined report and workflow summary
        env:
          SECURITY_JOB_RESULTS: ${{ toJSON(needs) }}
          SECURITY_REPORT_ARTIFACT: devsecops-security-reports
        run: python3 scripts/render-security-reports.py .tools/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: devsecops-security-reports
          path: .tools/reports/
          retention-days: 30

  deploy:
    name: 6 - Publish scanned image and deploy
    needs: trivy
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-image
          path: /tmp
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push the exact scanned artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd /tmp
          sha256sum -c image.tar.sha256
          docker load --input image.tar
          registry=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker tag "student-management:$COMMIT_SHA" "$registry/student-management:$COMMIT_SHA"
          docker push "$registry/student-management:$COMMIT_SHA"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$registry/student-management:$COMMIT_SHA")
          [[ "$image" == "$registry/student-management@sha256:"* ]]
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy through Azure control plane (no public Kubernetes API)
        run: |
          python3 scripts/make-deploy-bundle.py "$DEPLOY_IMAGE" > /tmp/deploy.sh
          az vm run-command invoke --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --command-id RunShellScript --scripts @/tmp/deploy.sh -o json > deploy-result.json
          python3 scripts/check-run-command.py deploy-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-evidence
          path: deploy-result.json
          retention-days: 14

  email:
    name: 7 - Email notification
    needs: [security, build, docker, trivy, deploy, reports]
    # Always the last stage on master pushes. The k3s deploy job is disabled by design
    # (AZURE_DEPLOY_ENABLED=false), so a skipped job is not reported as a problem here.
    if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.EMAIL_ENABLED == 'true'
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send status, stage results and run link (success or failure)
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          WORKFLOW_NAME: Commit security and build
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/notify-pipeline.py
