name: Pre-build security reports
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  precommit:
    name: Pre-commit hooks and threat-model evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-security.txt
      - run: python scripts/test-security-controls.py
      - run: python scripts/test-azure-preflight.py
      - run: python scripts/install-tools.py gitleaks
      - name: Preserve the STRIDE model for human review
        run: |
          test -s documentation/THREAT-MODEL.md
          mkdir -p .tools/reports/precommit
          cp documentation/THREAT-MODEL.md .tools/reports/precommit/THREAT-MODEL.md
      - name: Blocking pre-commit hooks with saved transcript
        run: python scripts/capture-check.py precommit .tools/reports/precommit -- pre-commit run --all-files --show-diff-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prebuild-hooks
          path: .tools/reports/
          retention-days: 30

  sast:
    name: Commit SAST - Semgrep
    needs: precommit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.182.1
      - name: Verify SAST rejects the labelled temporary fixture
        run: |
          set +e
          python scripts/security-exercise.py sast --report-dir .tools/reports/sast/controlled-exercise
          result=$?
          set -e
          test "$result" -eq 1
      - name: Blocking application SAST with saved report
        run: python scripts/capture-check.py semgrep .tools/reports/sast -- semgrep scan --config .semgrep --error --strict --metrics=off --json-output=.tools/reports/sast/semgrep.json src/main/java
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prebuild-sast
          path: .tools/reports/
          retention-days: 30

  secrets:
    name: Commit secrets - Gitleaks history
    needs: precommit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/install-tools.py gitleaks
      - name: Blocking history scan with redacted report
        run: python scripts/capture-check.py gitleaks .tools/reports/secrets -- .tools/gitleaks git . --redact --report-format json --report-path .tools/reports/secrets/gitleaks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prebuild-secrets
          path: .tools/reports/
          retention-days: 30

  dependencies:
    name: Commit dependencies - Trivy source POM and SBOM
    needs: precommit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependency metadata without compiling the application
        run: |
          python scripts/capture-check.py dependency-resolution .tools/reports/dependencies -- bash ./mvnw -B -ntp dependency:resolve
          test ! -d target/classes
          test ! -f target/student-management-0.0.1-SNAPSHOT.jar
      - run: python scripts/install-tools.py trivy
      - name: Blocking source dependency scan before Maven compilation
        run: python scripts/capture-check.py dependencies .tools/reports/dependencies -- python scripts/scan-maven-dependencies.py .tools/reports/dependencies --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prebuild-dependencies
          path: .tools/reports/
          retention-days: 30

  iac:
    needs: precommit
    name: Commit infrastructure - Terraform and Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/install-tools.py terraform actionlint
      - run: |
          .tools/actionlint
          .tools/terraform -chdir=terraform fmt -check
          .tools/terraform -chdir=terraform init -backend=false -input=false
          .tools/terraform -chdir=terraform validate
      - run: pip install --disable-pip-version-check checkov==3.3.29
      - name: Prove the SSH rejection gate and validate supporting files
        run: |
          python scripts/prove-ssh-gate.py
          python scripts/validate-project.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check pre-build ordering and inventory rejection
        run: python scripts/test-prebuild-security.py
      - name: Check Azure identity setup without contacting Azure
        shell: pwsh
        run: ./scripts/test-azure-oidc.ps1
      - name: Checkov default infrastructure policies
        run: |
          mkdir -p .tools/reports/iac
          python scripts/capture-check.py checkov-default .tools/reports/iac -- checkov --config-file .checkov.yml -o cli -o junitxml -o json --output-file-path console,.tools/reports/iac/checkov-default.xml,.tools/reports/iac/checkov-default.json
      - name: Scan optional Azure coursework tools too
        run: python scripts/capture-check.py checkov-course .tools/reports/iac -- checkov --config-file .checkov.yml --var-file terraform/coursework.tfvars.example -o cli -o junitxml -o json --output-file-path console,.tools/reports/iac/checkov-course.xml,.tools/reports/iac/checkov-course.json
      - name: Validate Azure Compose and HTTPS proxy configuration
        run: |
          python scripts/validate-course-config.py
          docker run --rm -v "$PWD/cloud/tools/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SONAR_DOMAIN=sonar.example.test -e NEXUS_DOMAIN=nexus.example.test \
            caddy:2.11.7 caddy adapt --config /etc/caddy/Caddyfile --validate > /tmp/caddy-config.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: prebuild-iac
          path: .tools/reports/
          retention-days: 30

  evidence:
    name: Collect readable pre-build reports
    needs: [precommit, sast, secrets, dependencies, iac]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: .tools/reports
      - name: Generate readable report and workflow summary
        env:
          SECURITY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/render-security-reports.py .tools/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: professor-security-reports
          path: .tools/reports/
          retention-days: 30
