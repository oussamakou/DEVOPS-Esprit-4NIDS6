name: Security exercise - intentional failure
on:
  workflow_dispatch:
    inputs:
      finding:
        description: Labelled temporary fixture to reject (no deployment)
        type: choice
        options: [hook, secret, sast]
        default: hook
permissions:
  contents: read
jobs:
  demonstrate:
    name: Controlled finding - screenshot this error
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-security.txt
      - if: inputs.finding == 'secret'
        run: python scripts/install-tools.py gitleaks
      - if: inputs.finding == 'sast'
        run: pip install semgrep==1.182.1
      - name: Reject the temporary fixture (expected red job)
        env:
          FINDING: ${{ inputs.finding }}
        run: python scripts/security-exercise.py "$FINDING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: labelled-exercise-evidence
          path: .tools/exercise
          retention-days: 14
