name: Coursework - SonarQube Nexus Compose
# Azure lane: manual only since the Azure for Students subscription ended (Nov 2026).
# Every master push now runs the full sequence on GitHub's runner (pipeline.yml).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coursework-delivery
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  security:
    name: Security before Maven
    uses: ./.github/workflows/prebuild-security.yml
  delivery:
    needs: security
    name: Cloud delivery stages
    if: github.ref == 'refs/heads/master'
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.COMPOSE_VM_NAME }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      NEXUS_MAVEN_URL: ${{ vars.NEXUS_MAVEN_URL }}
    steps:
      - name: 1 - Checkout Git
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install delivery helper dependency
        run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: 2 - Compile Maven and run tests
        run: python scripts/capture-check.py maven .tools/reports/build -- bash ./mvnw -B -ntp verify
      - name: Keep the Surefire and JaCoCo reports
        if: always()
        run: |
          mkdir -p .tools/reports/build
          cp -r target/surefire-reports .tools/reports/build/ || echo "No Surefire reports were produced"
          cp -r target/site/jacoco .tools/reports/build/ || echo "No JaCoCo report was produced"
      - name: Install image scanner after the pre-build security gates
        run: python scripts/install-tools.py trivy
      - name: Check cloud configuration (missing setup must fail clearly)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          names = ['SONAR_HOST_URL', 'SONAR_PROJECT_KEY', 'SONAR_TOKEN', 'NEXUS_MAVEN_URL', 'NEXUS_USERNAME', 'NEXUS_PASSWORD', 'ACR_NAME', 'AZURE_RESOURCE_GROUP', 'AZURE_VM_NAME', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID']
          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              raise SystemExit('Cloud setup incomplete: ' + ', '.join(missing) + '. See documentation/COURSEWORK-PIPELINE.md')
          for name in ['SONAR_HOST_URL', 'NEXUS_MAVEN_URL']:
              url = urlparse(os.environ[name])
              if url.scheme != 'https' or not url.hostname or url.username or url.password:
                  raise SystemExit(name + ' must be HTTPS without embedded credentials')
          PY
      - name: 3 - SonarQube analysis and blocking quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python scripts/capture-check.py sonar .tools/reports/quality -- bash ./mvnw -B -ntp sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
      - name: Keep the SonarQube analysis task record
        if: always()
        run: |
          mkdir -p .tools/reports/quality
          cp target/sonar/report-task.txt .tools/reports/quality/ || echo "No SonarQube task record was produced"
      - name: 4 - Nexus publish the tested Maven artifact
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          python scripts/capture-check.py nexus-deploy .tools/reports/artifact -- bash ./mvnw -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=nexus -Durl="$NEXUS_MAVEN_URL" -DpomFile=pom.xml \
            -Dfile=target/student-management-0.0.1-SNAPSHOT.jar
          python scripts/capture-check.py nexus-verify .tools/reports/artifact -- python scripts/nexus-artifact-report.py \
            "$NEXUS_MAVEN_URL" target/student-management-0.0.1-SNAPSHOT.jar pom.xml .tools/reports/artifact
      - name: 5 - Build image from the tested JAR and scan
        run: |
          python scripts/capture-check.py docker-build .tools/reports/image -- docker build --target ci --tag "student-management:$GITHUB_SHA" .
          python scripts/stage-facts.py .tools/reports/image docker-build \
            image="student-management:$GITHUB_SHA" \
            image_id="$(docker image inspect --format '{{.Id}}' "student-management:$GITHUB_SHA")" \
            size_bytes="$(docker image inspect --format '{{.Size}}' "student-management:$GITHUB_SHA")"
          python scripts/capture-check.py trivy-image .tools/reports/image -- .tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output .tools/reports/image/trivy-image.json "student-management:$GITHUB_SHA"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: 6 - Deploy image to Azure Container Registry
        id: publish
        run: |
          registry=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker tag "student-management:$GITHUB_SHA" "$registry/student-management:$GITHUB_SHA"
          python scripts/capture-check.py acr-push .tools/reports/registry -- docker push "$registry/student-management:$GITHUB_SHA"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$registry/student-management:$GITHUB_SHA")
          [[ "$image" == "$registry/student-management@sha256:"* ]]
          python scripts/stage-facts.py .tools/reports/registry acr-push registry="$registry" tag="$GITHUB_SHA" image="$image"
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: 7 - Docker Compose on the Azure VM
        run: |
          python scripts/make-compose-bundle.py deploy "$DEPLOY_IMAGE" > /tmp/compose-deploy.sh
          az vm run-command invoke --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --command-id RunShellScript --scripts @/tmp/compose-deploy.sh -o json > compose-result.json
          mkdir -p .tools/reports/deploy
          cp compose-result.json .tools/reports/deploy/compose-run-command.json
          python scripts/stage-facts.py .tools/reports/deploy compose-deploy image="$DEPLOY_IMAGE" vm="$AZURE_VM_NAME"
          python scripts/capture-check.py compose-deploy .tools/reports/deploy -- python scripts/check-run-command.py compose-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-delivery
          path: .tools/reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coursework-evidence
          path: |
            target/surefire-reports
            target/site/jacoco
            target/sonar/report-task.txt
            compose-result.json
          retention-days: 14
  acceptance:
    name: 8 - Acceptance - Nmap
    needs: delivery
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/acceptance-nmap.yml
  monitoring:
    name: 9 - Production - Monitoring with Prometheus and Grafana
    needs: [delivery, acceptance]
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.COMPOSE_VM_NAME }}
      DEPLOY_IMAGE: ${{ needs.delivery.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the deployed image, API and monitoring targets
        run: |
          python scripts/make-compose-bundle.py monitor "$DEPLOY_IMAGE" > /tmp/compose-monitor.sh
          az vm run-command invoke --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --command-id RunShellScript --scripts @/tmp/compose-monitor.sh -o json > monitoring-result.json
          mkdir -p .tools/reports/monitoring
          cp monitoring-result.json .tools/reports/monitoring/monitor-run-command.json
          python scripts/capture-check.py monitoring-check .tools/reports/monitoring -- python scripts/check-run-command.py monitoring-result.json
      - name: Collect Prometheus and Grafana evidence from the VM
        if: ${{ !cancelled() }}
        run: python scripts/capture-check.py prometheus-grafana .tools/reports/monitoring -- python scripts/azure-monitoring-evidence.py --output .tools/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-monitoring
          path: .tools/reports/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: monitoring-evidence
          path: monitoring-result.json
          retention-days: 30
  dependabot:
    name: 10 - Production - Dependabot updates and alerts
    needs: acceptance
    # Production-phase report: findings are highlighted, not blocking. Runs even if the previous phase failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Collect Dependabot configuration, open update PRs and security alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/capture-check.py dependabot .tools/reports/dependabot -- python scripts/dependabot-report.py .tools/reports/dependabot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-dependabot
          path: .tools/reports/
          retention-days: 30
  reports:
    name: DevSecOps security reports - all phases
    needs: [security, delivery, acceptance, monitoring, dependabot]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect pre-commit and commit evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: professor-security-reports
          path: .tools/reports
      - name: Collect build, quality, artifact, image, deployment and monitoring evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage-*
          merge-multiple: true
          path: .tools/reports
      - name: Collect acceptance evidence without overwriting the pre-build index
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nmap-acceptance-original-reports
          path: .tools/reports/acceptance
      - name: Generate the combined standalone security report
        env:
          SECURITY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/render-security-reports.py .tools/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: devsecops-security-reports
          path: .tools/reports/
          retention-days: 30
  email:
    name: 11 - Email notification
    needs: [security, delivery, acceptance, monitoring, dependabot, reports]
    if: always() && github.ref == 'refs/heads/master' && vars.EMAIL_ENABLED == 'true'
    environment: azure-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Send status and run link (success or failure)
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success' }}
          WORKFLOW_NAME: Coursework pipeline
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/notify-pipeline.py
